<title>Fish School Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Single-theme by intent: the page is a viewport onto a dark WEBGL render,
     and its ground is the sketch's own S.glow.base. Every colour is painted
     explicitly so it holds on either host ground. */
  :root {
    --ground: #14100e;
    --panel: rgba(26, 21, 18, 0.86);
    --panel-solid: #1a1512;
    --line: #3a2f27;
    --line-soft: #2a221d;
    --text: #f0e8de;
    --dim: #9d9083;
    --faint: #6d6258;
    --accent: #55d264;      /* HSB hue 90/255 ≈ 127°, the school's default inner colour */
    --accent-dim: #2f7a3a;

    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* p5 appends the canvas to body; pin it behind the console. */
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    touch-action: none;
  }

  /* ----------------------------- console ---------------------------- */
  .console {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .sheet {
    pointer-events: auto;
    width: 100%;
    max-width: 520px;
    margin: 0 16px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    background: none;
    border: none;
    width: 100%;
    color: inherit;
    font: inherit;
    text-align: left;
    border-radius: 14px 14px 0 0;
  }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .sketch-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  .rev {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.04em;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .chevron {
    width: 11px;
    height: 11px;
    border-right: 1.5px solid var(--dim);
    border-bottom: 1.5px solid var(--dim);
    transform: rotate(-135deg) translate(-2px, -2px);
    transition: transform 0.22s ease;
    flex: none;
  }
  .sheet[data-open="false"] .chevron {
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .knobs {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 4px 16px 18px;
    border-top: 1px solid var(--line-soft);
    max-height: 56vh;
    overflow-y: auto;
  }

  .knob { display: flex; flex-direction: column; gap: 7px; }

  .knob-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.05em;
  }
  .knob-head .name { color: var(--dim); }
  .knob-head .val {
    margin-left: auto;
    color: var(--accent);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* ------------------------------ sliders --------------------------- */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    background: none;
    margin: 0;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 17px;
    height: 17px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--text);
    border: 3px solid var(--panel-solid);
    box-shadow: 0 0 0 1px var(--accent-dim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--text);
    border: 3px solid var(--panel-solid);
    box-shadow: 0 0 0 1px var(--accent-dim);
  }
  input[type="range"]:focus-visible { outline: none; }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--accent); }
  input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 2px var(--accent); }

  /* The colour knobs only offer p5 hue 75–205 (green → blue → purple), so the
     track shows just that slice of the wheel — no reds or yellows. */
  input[type="range"].hue-track::-webkit-slider-runnable-track {
    height: 5px;
    background: linear-gradient(to right,
      hsl(106, 100%, 58%), hsl(152, 100%, 55%), hsl(198, 100%, 58%),
      hsl(244, 100%, 68%), hsl(289, 90%, 66%));
  }
  input[type="range"].hue-track::-moz-range-track {
    height: 5px;
    background: linear-gradient(to right,
      hsl(106, 100%, 58%), hsl(152, 100%, 55%), hsl(198, 100%, 58%),
      hsl(244, 100%, 68%), hsl(289, 90%, 66%));
  }
  input[type="range"].hue-track::-webkit-slider-thumb { margin-top: -6px; }

  /* ------------------------------ segments -------------------------- */
  .segments {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
  }
  .segments button {
    flex: 1;
    padding: 9px 10px;
    background: none;
    border: none;
    border-right: 1px solid var(--line);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .segments button:last-child { border-right: none; }
  .segments button[aria-pressed="true"] {
    background: var(--accent);
    color: #14100e;
    font-weight: 600;
  }
  .segments button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ----------------------------- switches --------------------------- */
  .knob-head .name.strong { color: var(--text); }
  .switch {
    flex: none;
    align-self: center;
    margin-left: auto;
    position: relative;
    width: 40px;
    height: 24px;
    padding: 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--line-soft);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .switch::before { content: ""; position: absolute; inset: -10px; } /* bigger tap target */
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--dim);
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(16px); background: #14100e; }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sub { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; transition: opacity 0.2s ease; }

  .section {
    margin-top: 6px;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .knob { transition: opacity 0.2s ease; }

  /* ------------------------------ footer ---------------------------- */
  .readout {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }
  .readout code {
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--faint);
    word-break: break-all;
    user-select: all;
    -webkit-user-select: all;
  }
  .reset {
    flex: none;
    align-self: flex-start;
    padding: 6px 11px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .reset:hover { color: var(--text); border-color: var(--dim); }
  .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .chevron, .switch, .switch::after, .sub { transition: none; }
  }
</style>

<div class="console">
  <div class="sheet" id="sheet" data-open="true">
    <button class="bar" id="bar" aria-expanded="true" aria-controls="knobs">
      <span class="chevron" aria-hidden="true"></span>
      <span class="sketch-name">fish-school</span>
      <span class="rev" id="rev">fps —</span>
    </button>

    <div class="knobs" id="knobs">
      <div class="knob" id="k-wave">
        <div class="knob-head">
          <span class="name strong">wave shader</span>
          <button type="button" class="switch" role="switch" data-key="fx_wave" aria-checked="true" aria-label="wave shader"></button>
        </div>
        <div class="sub" id="wave-sub">
          <div class="knob-head"><span class="name">current</span><span class="val" id="v-wave">35</span></div>
          <input type="range" id="wave" min="0" max="100" step="1" value="35" aria-label="current">
        </div>
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">body</span><span class="val" id="v-shape"></span></div>
        <div class="segments" id="shape" role="group" aria-label="body">
          <button type="button" data-value="circle" aria-pressed="false">circle</button>
          <button type="button" data-value="ellipse" aria-pressed="false">ellipse</button>
          <button type="button" data-value="fish" aria-pressed="true">fish</button>
          <button type="button" data-value="flower" aria-pressed="false">flower</button>
        </div>
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">school_size</span><span class="val" id="v-count">68</span></div>
        <input type="range" id="count" min="4" max="68" step="1" value="68" aria-label="school_size">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">frequency</span><span class="val" id="v-freq">2.0</span></div>
        <input type="range" id="freq" min="1" max="3" step="0.1" value="2" aria-label="frequency">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">scatter</span><span class="val" id="v-noise">20</span></div>
        <input type="range" id="noise" min="1" max="100" step="1" value="20" aria-label="scatter">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">inner_color</span><span class="val" id="v-hue">90</span></div>
        <input type="range" class="hue-track" id="hue" min="75" max="205" step="1" value="90" aria-label="inner_color">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">outer_color</span><span class="val" id="v-hue2">180</span></div>
        <input type="range" class="hue-track" id="hue2" min="75" max="205" step="1" value="180" aria-label="outer_color">
      </div>

      <div class="section">additional parameters</div>

      <div class="knob">
        <div class="knob-head">
          <span class="name strong">glow shader</span>
          <button type="button" class="switch" role="switch" data-key="fx_glow" aria-checked="true" aria-label="glow shader"></button>
        </div>
      </div>

      <div class="knob">
        <div class="knob-head">
          <span class="name strong">grain shader</span>
          <button type="button" class="switch" role="switch" data-key="fx_grain" aria-checked="true" aria-label="grain shader"></button>
        </div>
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">core_size</span><span class="val" id="v-core">50</span></div>
        <input type="range" id="core" min="0" max="100" step="1" value="50" aria-label="core_size">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">behavior</span></div>
        <div class="segments" id="orbit_mode" role="group" aria-label="behavior">
          <button type="button" data-value="clouds" aria-pressed="true">clouds</button>
          <button type="button" data-value="beads" aria-pressed="false">beads</button>
        </div>
      </div>

      <div class="readout">
        <code id="readout"></code>
        <button type="button" class="reset" id="reset">RESET</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<script>
(() => {
  /* The sketch reads a `data` global, exactly as the host posts it into the
     sandboxed avatar iframe. The console below writes into that same object,
     so what renders here is what a participant payload would render. */
  /* Kept in step with DEFAULTS in sketch.js by hand — the bench is a second
     host, not the source of truth, and a drift here is a bench that lies. */
  const DEFAULTS = {
    core: 50, orbit_mode: "clouds", shape: ["fish"], freq: 2, noise: 20, hue: 90, hue2: 180,
    count: 68, wave: 35, fx_glow: true, fx_wave: true, fx_grain: true,
  };
  const STORE = "fish-school:knobs";

  let saved = {};
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) saved = JSON.parse(raw) || {};
  } catch (e) { /* private window, blocked storage — defaults are fine */ }

  // Carried across a republish when the runtime offers it; falls back to storage.
  const hot = (window.claude && window.claude.hot && window.claude.hot.data) || null;

  window.data = Object.assign({}, DEFAULTS, saved, hot || {});

  // Shapes are multi-select. Older saves hold a single name ("fish") — accept
  // that, drop anything unknown, and never leave the list empty.
  const SHAPES = ["circle", "ellipse", "fish", "flower"];
  function normShapes(v) {
    const list = Array.isArray(v) ? v : typeof v === "string" ? v.split(",") : [];
    const kept = SHAPES.filter((n) => list.map((x) => String(x).trim().toLowerCase()).includes(n));
    return kept.length ? kept : ["circle"];
  }
  window.data.shape = normShapes(window.data.shape);

  const SLIDERS = ["core", "freq", "noise", "hue", "hue2", "count", "wave"];
  const els = {};
  SLIDERS.forEach((k) => {
    els[k] = document.getElementById(k);
    els["v-" + k] = document.getElementById("v-" + k);
  });

  // A value saved (or carried over) from before a range was narrowed falls back
  // to its default instead of pinning to an edge, so e.g. a red outer colour
  // from an old session does not survive the palette change.
  SLIDERS.forEach((k) => {
    const v = Number(window.data[k]);
    if (!Number.isFinite(v) || v < Number(els[k].min) || v > Number(els[k].max)) {
      window.data[k] = DEFAULTS[k];
    }
  });
  const readout = document.getElementById("readout");
  const segs = document.getElementById("orbit_mode");
  const shapeSegs = document.getElementById("shape");
  const switches = document.querySelectorAll(".switch");
  const waveSub = document.getElementById("wave-sub");
  const shapeVal = document.getElementById("v-shape");

  function fmt(k, v) {
    return k === "freq" ? Number(v).toFixed(1) : String(Math.round(v));
  }

  function paint() {
    SLIDERS.forEach((k) => {
      els[k].value = window.data[k];
      els["v-" + k].textContent = fmt(k, window.data[k]);
    });
    segs.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.value === window.data.orbit_mode));
    });
    shapeSegs.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(window.data.shape.includes(b.dataset.value)));
    });
    shapeVal.textContent = window.data.shape.length > 1 ? window.data.shape.length + " alternating" : "";
    switches.forEach((sw) => {
      sw.setAttribute("aria-checked", String(!!window.data[sw.dataset.key]));
    });
    waveSub.style.opacity = window.data.fx_wave ? "1" : "0.4";
    readout.textContent = JSON.stringify(window.data);
    try {
      localStorage.setItem(STORE, JSON.stringify(window.data));
    } catch (e) { /* nothing to do — the knobs still work this session */ }
  }

  SLIDERS.forEach((k) => {
    els[k].addEventListener("input", () => {
      window.data[k] = Number(els[k].value);
      paint();
    });
  });

  segs.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    window.data.orbit_mode = btn.dataset.value;
    paint();
  });

  shapeSegs.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const on = new Set(window.data.shape);
    if (on.has(btn.dataset.value)) {
      if (on.size > 1) on.delete(btn.dataset.value); // keep at least one
    } else {
      on.add(btn.dataset.value);
    }
    window.data.shape = SHAPES.filter((n) => on.has(n)); // a new array each time
    paint();
  });

  switches.forEach((sw) => {
    sw.addEventListener("click", () => {
      window.data[sw.dataset.key] = !window.data[sw.dataset.key];
      paint();
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    Object.assign(window.data, DEFAULTS, { shape: DEFAULTS.shape.slice() });
    paint();
  });

  const sheet = document.getElementById("sheet");
  const bar = document.getElementById("bar");
  const knobs = document.getElementById("knobs");
  bar.addEventListener("click", () => {
    const open = sheet.dataset.open !== "true";
    sheet.dataset.open = String(open);
    bar.setAttribute("aria-expanded", String(open));
    knobs.hidden = !open;
  });

  // Frame rate, so a change that costs performance is visible rather than felt.
  const rev = document.getElementById("rev");
  setInterval(() => {
    if (typeof frameRate === "function") rev.textContent = "fps " + Math.round(frameRate());
  }, 500);

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => window.data);
  }

  paint();
})();
</script>
<script src="sketch.js"></script>
