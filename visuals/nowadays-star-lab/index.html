<title>Nowadays Star Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Single-theme by intent: the page is a viewport onto a dark WEBGL render,
     and its ground is the sketch's own S.glow.base. Every colour is painted
     explicitly so it holds on either host ground. */
  :root {
    --ground: #14100e;
    --panel: rgba(26, 21, 18, 0.86);
    --panel-solid: #1a1512;
    --line: #3a2f27;
    --line-soft: #2a221d;
    --text: #f0e8de;
    --dim: #9d9083;
    --faint: #6d6258;
    --accent: #b8d44e;
    --accent-dim: #6f832c;

    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* p5 appends the canvas to body; pin it behind the console. */
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    touch-action: none;
  }

  /* ----------------------------- console ---------------------------- */
  .console {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .sheet {
    pointer-events: auto;
    width: 100%;
    max-width: 520px;
    margin: 0 16px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    background: none;
    border: none;
    width: 100%;
    color: inherit;
    font: inherit;
    text-align: left;
    border-radius: 14px 14px 0 0;
  }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .sketch-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  .rev {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.04em;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .chevron {
    width: 11px;
    height: 11px;
    border-right: 1.5px solid var(--dim);
    border-bottom: 1.5px solid var(--dim);
    transform: rotate(-135deg) translate(-2px, -2px);
    transition: transform 0.22s ease;
    flex: none;
  }
  .sheet[data-open="false"] .chevron {
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .knobs {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 4px 16px 18px;
    border-top: 1px solid var(--line-soft);
    max-height: 56vh;
    overflow-y: auto;
  }

  .knob { display: flex; flex-direction: column; gap: 7px; }

  .knob-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.05em;
  }
  .knob-head .name { color: var(--dim); }
  .knob-head .val {
    margin-left: auto;
    color: var(--accent);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* ------------------------------ sliders --------------------------- */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    background: none;
    margin: 0;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 17px;
    height: 17px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--text);
    border: 3px solid var(--panel-solid);
    box-shadow: 0 0 0 1px var(--accent-dim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--text);
    border: 3px solid var(--panel-solid);
    box-shadow: 0 0 0 1px var(--accent-dim);
  }
  input[type="range"]:focus-visible { outline: none; }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--accent); }
  input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 2px var(--accent); }

  /* p5's HSB hue runs 0–255 over the full wheel, so the track is the wheel. */
  .hue-track::-webkit-slider-runnable-track {
    height: 5px;
    background: linear-gradient(to right,
      #ff2d2d 0%, #ffe32d 16.6%, #35ff5a 33.3%,
      #2dfbff 50%, #2d5bff 66.6%, #ff2df0 83.3%, #ff2d2d 100%);
  }
  .hue-track::-moz-range-track {
    height: 5px;
    background: linear-gradient(to right,
      #ff2d2d 0%, #ffe32d 16.6%, #35ff5a 33.3%,
      #2dfbff 50%, #2d5bff 66.6%, #ff2df0 83.3%, #ff2d2d 100%);
  }
  .hue-track::-webkit-slider-thumb { margin-top: -6px; }

  /* ------------------------------ segments -------------------------- */
  .segments {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
  }
  .segments button {
    flex: 1;
    padding: 9px 10px;
    background: none;
    border: none;
    border-right: 1px solid var(--line);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .segments button:last-child { border-right: none; }
  .segments button[aria-pressed="true"] {
    background: var(--accent);
    color: #14100e;
    font-weight: 600;
  }
  .segments button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ------------------------------ footer ---------------------------- */
  .readout {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }
  .readout code {
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--faint);
    word-break: break-all;
    user-select: all;
    -webkit-user-select: all;
  }
  .reset {
    flex: none;
    align-self: flex-start;
    padding: 6px 11px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .reset:hover { color: var(--text); border-color: var(--dim); }
  .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
</style>

<div class="console">
  <div class="sheet" id="sheet" data-open="true">
    <button class="bar" id="bar" aria-expanded="true" aria-controls="knobs">
      <span class="chevron" aria-hidden="true"></span>
      <span class="sketch-name">nowadays-star</span>
      <span class="rev" id="rev">fps —</span>
    </button>

    <div class="knobs" id="knobs">
      <div class="knob">
        <div class="knob-head"><span class="name">core_size</span><span class="val" id="v-core">50</span></div>
        <input type="range" id="core" min="0" max="100" step="1" value="50" aria-label="core_size">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">behavior</span></div>
        <div class="segments" id="orbit_mode" role="group" aria-label="behavior">
          <button type="button" data-value="clouds" aria-pressed="true">clouds</button>
          <button type="button" data-value="beads" aria-pressed="false">beads</button>
        </div>
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">frequency</span><span class="val" id="v-freq">5.0</span></div>
        <input type="range" id="freq" min="1" max="6" step="0.1" value="5" aria-label="frequency">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">scatter</span><span class="val" id="v-noise">20</span></div>
        <input type="range" id="noise" min="1" max="100" step="1" value="20" aria-label="scatter">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">inner_color</span><span class="val" id="v-hue">69</span></div>
        <input type="range" class="hue-track" id="hue" min="0" max="255" step="1" value="69" aria-label="inner_color">
      </div>

      <div class="knob">
        <div class="knob-head"><span class="name">outer_color</span><span class="val" id="v-hue2">0</span></div>
        <input type="range" class="hue-track" id="hue2" min="0" max="255" step="1" value="0" aria-label="outer_color">
      </div>

      <div class="readout">
        <code id="readout"></code>
        <button type="button" class="reset" id="reset">RESET</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<script>
  /* The sketch reads a `data` global, exactly as the host posts it into the
     sandboxed avatar iframe. The console below writes into that same object,
     so what renders here is what a participant payload would render. */
  const DEFAULTS = { core: 50, orbit_mode: "clouds", freq: 5, noise: 20, hue: 69, hue2: 0 };
  const STORE = "nowadays-star-lab:knobs";

  let saved = {};
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) saved = JSON.parse(raw) || {};
  } catch (e) { /* private window, blocked storage — defaults are fine */ }

  // Carried across a republish when the runtime offers it; falls back to storage.
  const hot = (window.claude && window.claude.hot && window.claude.hot.data) || null;

  window.data = Object.assign({}, DEFAULTS, saved, hot || {});

  const SLIDERS = ["core", "freq", "noise", "hue", "hue2"];
  const els = {};
  SLIDERS.forEach((k) => {
    els[k] = document.getElementById(k);
    els["v-" + k] = document.getElementById("v-" + k);
  });
  const readout = document.getElementById("readout");
  const segs = document.getElementById("orbit_mode");

  function fmt(k, v) {
    return k === "freq" ? Number(v).toFixed(1) : String(Math.round(v));
  }

  function paint() {
    SLIDERS.forEach((k) => {
      els[k].value = window.data[k];
      els["v-" + k].textContent = fmt(k, window.data[k]);
    });
    segs.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.value === window.data.orbit_mode));
    });
    readout.textContent = JSON.stringify(window.data);
    try {
      localStorage.setItem(STORE, JSON.stringify(window.data));
    } catch (e) { /* nothing to do — the knobs still work this session */ }
  }

  SLIDERS.forEach((k) => {
    els[k].addEventListener("input", () => {
      window.data[k] = Number(els[k].value);
      paint();
    });
  });

  segs.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    window.data.orbit_mode = btn.dataset.value;
    paint();
  });

  document.getElementById("reset").addEventListener("click", () => {
    Object.assign(window.data, DEFAULTS);
    paint();
  });

  const sheet = document.getElementById("sheet");
  const bar = document.getElementById("bar");
  const knobs = document.getElementById("knobs");
  bar.addEventListener("click", () => {
    const open = sheet.dataset.open !== "true";
    sheet.dataset.open = String(open);
    bar.setAttribute("aria-expanded", String(open));
    knobs.hidden = !open;
  });

  // Frame rate, so a change that costs performance is visible rather than felt.
  const rev = document.getElementById("rev");
  setInterval(() => {
    if (typeof frameRate === "function") rev.textContent = "fps " + Math.round(frameRate());
  }, 500);

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => window.data);
  }

  paint();
</script>
<script src="sketch.js"></script>
